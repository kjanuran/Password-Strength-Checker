
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Checker</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">

    <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">

        <h1 class="mb-2 text-2xl font-bold text-gray-800">
            Password Strength Checker
        </h1>

        <p class="mb-6 text-sm text-gray-500">
            Check how strong your password is.
        </p>

        <!-- Password input -->
        <label for="password" class="mb-2 block text-sm font-medium text-gray-700">
            Enter Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-blue-500"
        >

        
        <!-- Password strength section -->
        <div class="mt-5">

            <!-- Strength label -->
            <div class="mb-2 flex items-center justify-between">
                <span class="text-sm font-medium text-gray-700">
                    Password Strength
                </span>

                <span id="strengthText" class="text-sm font-semibold text-gray-500">
                    Not entered
                </span>
            </div>

            <!-- Progress bar background -->
            <div class="h-2 w-full overflow-hidden rounded-full bg-gray-200">

                <!-- Progress bar fill -->
                <div
                    id="strengthBar"
                    class="h-2 w-0 rounded-full bg-red-500 transition-all duration-300"
                ></div>

            </div>

            <!-- Validation message -->
            <p id="validationMessage" class="mt-3 text-sm text-gray-500">
                Enter a password to check its strength.
            </p>

        </div>


    </div>

    <script src="script.js"></script>
</body>
</html>
